on: [push]
name: Linux_Container_Workflow

jobs:     
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
        # checkout the repo
        - name: 'Checkout GitHub Action'
          uses: actions/checkout@main
          
        - name: 'Login via Azure CLI'
          uses: azure/login@v1
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}
        
        - name: 'Build and push image'
          uses: azure/docker-login@v1
          with:
            login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
            username: ${{ secrets.REGISTRY_USERNAME }}
            password: ${{ secrets.REGISTRY_PASSWORD }}
            
        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_ACCESSTOKEN }}
            registry: dhi.io
            
        - run: |
            docker build ./ReciBee.API -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/recibee-api:${{ github.sha }}
            docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/recibee-api:${{ github.sha }}

        - name: Build and deploy Container App
          uses: azure/container-apps-deploy-action@v1
          with:
              acrName: RecipeAppRegistry
              containerAppName: container-app-c9b4
              resourceGroup: ${{ secrets.RESOURCE_GROUP }}
              imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/recibee-api:${{ github.sha }}
              location: 'westus2'
              ports: 8000
